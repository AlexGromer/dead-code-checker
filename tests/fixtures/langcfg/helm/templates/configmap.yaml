{{- $vals := .Values.settings }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  motd: {{ tpl .Values.motd . | quote }}
  level: {{ $vals.level }}
  {{- if .Values.debug.enabled }}
  debug: "true"
  {{- end }}
