worker_processes auto;
http {
    include mime.types;
    include conf.d/*.conf;
    load_module modules/ngx_http_js_module.so;
    server {
        listen 80;
        root /var/www/html;
        ssl_certificate /etc/ssl/certs/site.pem;
        location / {
            include snippets/proxy.conf;
            alias /srv/static/;
        }
    }
}
